# =============================================================================
# RAGOps Control Plane — on-prem stack
# -----------------------------------------------------------------------------
#   postgres   : control-plane state (documents, indexes, releases, jobs, audit)
#   qdrant     : vector store (one collection per index version)
#   backend    : FastAPI control + data + job + observability plane
#   worker     : Postgres-backed job runner (ingestion / index build / eval)
#   frontend   : operator console (read the platform, drive releases)
#   langfuse   : observability plane (self-hosted Langfuse v2 + its own Postgres)
#
# Only Ollama runs on the HOST (it serves local LLMs) and is reached via
# host.docker.internal:11434  (run `ollama serve` + `ollama pull llama3.2`).
# Langfuse is bootstrapped headlessly: the API keys below are created on first
# boot and already wired into the backend, so tracing works with no manual setup.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: ragops-v1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragops
      POSTGRES_PASSWORD: ragops
      POSTGRES_DB: ragops
    ports:
      # V1 uses 5443 (V2 uses 5433; Langfuse uses 5432).
      # Container-to-container traffic still uses the internal 5432.
      - "5443:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragops -d ragops"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ragops]

  qdrant:
    image: qdrant/qdrant:v1.12.2
    container_name: ragops-v1-qdrant
    restart: unless-stopped
    ports:
      - "6343:6333"   # REST (V1 uses 6343; V2 uses 6333)
      - "6344:6334"   # gRPC  (V1 uses 6344; V2 uses 6334)
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 512m
    networks: [ragops]

  # ---- Cache + rate-limit plane: Redis (optional; serving degrades gracefully) ----
  redis:
    image: redis:7-alpine
    container_name: ragops-v1-redis
    restart: unless-stopped
    # Pure cache: no persistence, cap memory and evict least-recently-used keys.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # V1 uses 6390 (V2 uses 6380; Langfuse uses 6379).
      # Container-to-container traffic still uses 6379.
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [ragops]

  # ---- Observability plane: bundled Langfuse v2 (disabled when LANGFUSE_HOST_MODE=external) ----
  langfuse-db:
    image: postgres:16-alpine
    container_name: ragops-v1-langfuse-db
    restart: unless-stopped
    profiles: ["bundled-langfuse"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ragops]

  langfuse:
    image: langfuse/langfuse:2
    container_name: ragops-v1-langfuse
    restart: unless-stopped
    profiles: ["bundled-langfuse"]
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      # Host 3000 is taken by an existing Langfuse instance; publish on 3100.
      - "3110:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3110
      # ---- DEMO-ONLY secrets. Generate fresh values for any real deployment. ----
      NEXTAUTH_SECRET: ragops-demo-nextauth-secret-change-me
      SALT: ragops-demo-salt-change-me
      ENCRYPTION_KEY: 9f2b7c1ad4e6480fb3c5102938475665a1b2c3d4e5f60718293a4b5c6d7e8f90
      TELEMETRY_ENABLED: "false"
      # Headless bootstrap: provisions an org/project/login and the exact API
      # keys the backend uses, so tracing works on first boot with zero clicks.
      LANGFUSE_INIT_ORG_ID: ragops-org
      LANGFUSE_INIT_ORG_NAME: RAGOps
      LANGFUSE_INIT_PROJECT_ID: ragops-project
      LANGFUSE_INIT_PROJECT_NAME: RAGOps Control Plane
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-ragops-demo
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-ragops-demo
      LANGFUSE_INIT_USER_EMAIL: admin@ragops.local
      LANGFUSE_INIT_USER_NAME: RAGOps Admin
      LANGFUSE_INIT_USER_PASSWORD: ragops-admin
    networks: [ragops]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ragops-v1-backend:latest
    container_name: ragops-v1-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Networking is fixed to compose service names regardless of .env so the
      # same .env can also be used for bare-metal local dev.
      DATABASE_URL: postgresql+psycopg2://ragops:ragops@postgres:5432/ragops
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      OLLAMA_HOST: http://host.docker.internal:11434
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_BASE_URL:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-ragops-demo}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-ragops-demo}
      ENVIRONMENT: production
      # API has a dedicated worker container, so it does not embed one.
      RAGOPS_EMBED_WORKER: "0"
      # When external, skip bundled Langfuse dependency and use host Langfuse v3.
      LANGFUSE_HOST_MODE: ${LANGFUSE_HOST_MODE:-bundled}
      # Redis powers response caching + API rate limiting. If it is down the API
      # still serves (cache/limit simply no-op / fail open).
      REDIS_URL: redis://redis:6379/0
    mem_limit: 512m
    ports:
      - "8010:8000"
    volumes:
      - ragops_data:/app/data     # generated artifacts stay inside Docker
      - ./documents:/app/data/documents  # input documents visible on host
      - hf_models:/models         # huggingface + sentence-transformers cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    networks: [ragops]

  worker:
    # No build block — reuses the image built by `backend` (same Dockerfile).
    # Having two `build` blocks on the same image tag causes a race condition
    # where both try to export to the same tag simultaneously and one
    # fails with "image already exists". The backend service builds it; the
    # worker just references the tag.
    image: ragops-v1-backend:latest
    container_name: ragops-v1-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ragops:ragops@postgres:5432/ragops
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      OLLAMA_HOST: http://host.docker.internal:11434
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_BASE_URL:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-ragops-demo}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-ragops-demo}
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      LANGFUSE_HOST_MODE: ${LANGFUSE_HOST_MODE:-bundled}
      # Run several worker threads so a slow eval never blocks fast ingestion.
      WORKER_MAX_CONCURRENT_JOBS: "3"
    mem_limit: 1g
    volumes:
      - ragops_data:/app/data     # MUST match backend so artifacts are shared
      - ./documents:/app/data/documents  # input documents visible on host
      - hf_models:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from app.database import check_db; check_db()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [ragops]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Bake the V1 API URL into the Next.js standalone build.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8010/api/v1
    image: ragops-v1-frontend:latest
    container_name: ragops-v1-frontend
    restart: unless-stopped
    environment:
      # Browser-side calls hit the API through the host-published port.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8010/api/v1
    ports:
      - "3011:3000"
    depends_on:
      - backend
    networks: [ragops]

volumes:
  pg_data:
  qdrant_data:
  ragops_data:
  hf_models:
  langfuse_db_data:

# Profiles:
#   docker compose up -d                 -> runs without bundled Langfuse (use host Langfuse v3)
#   docker compose --profile bundled-langfuse up -d -> runs bundled Langfuse v2 on port 3100

networks:
  ragops:
    driver: bridge
